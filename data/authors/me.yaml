# ----- EXPERIENCE -----
experience:
  - role: Graduate Research Assistant
    org: Princeton University · Complex Materials Theory Group
    start: 2023-09-01
    end:
    summary: |
      Advisor: [Prof. Salvatore Torquato](https://torquato.princeton.edu). Princeton, NJ.

      - Advance theory and computational methods in inverse statistical mechanics for the targeted design of materials with prescribed structure, with emphasis on disordered stealthy hyperuniform ground states.
      - Quantified how diverse initial many-particle configurations evolve to hyperuniform ground states, and how nonequilibrium initial conditions relax to equilibrium, using large-scale Monte Carlo and molecular dynamics simulations on multi-GPU clusters. First-author paper in *Phys. Rev. E*; second first-author manuscript in preparation.
      - Designed and implemented scalable CPU- and GPU-parallel algorithms for many-body simulation in HPC environments (C/C++ with OpenMP and SIMD, CUDA, JAX).
      - Built a bootstrap uncertainty-quantification pipeline for relaxation times estimated from noisy simulation time series, cutting data volume and runtime by orders of magnitude while reproducing the original estimates exactly.
      - Diagnosed estimator bias and sampling artifacts that would otherwise have distorted published results, and designed corrected analysis protocols.
      - Implemented GPU-accelerated mutual-information estimators in JAX to analyze hundreds of gigabytes of stochastic trajectory data.
      - Developed deep-learning models (neural operators, diffusion models, equivariant graph networks) in PyTorch to infer interaction potentials from structural data, benchmarking architectures across hundreds of tracked GPU runs.
    tags:
      - C/C++
      - CUDA
      - JAX
      - PyTorch
      - Monte Carlo
      - Molecular dynamics
      - SLURM
    button:
      text: "S. J. Dawley & S. Torquato, Phys. Rev. E 112, 045310 (2025)"
      url: "https://doi.org/10.1103/9wbz-h7t4"

  - role: Research Intern
    org: PARADIM (NSF Materials Innovation Platform) · Johns Hopkins University
    start: 2022-06-01
    end: 2022-08-31
    summary: |
      Advisors: Dr. David Elbert, [Prof. Tyrel McQueen](https://occamy.chemistry.jhu.edu), Dr. Apurva Mehta. Baltimore, MD.

      - Advanced strategies for real-time data analysis and autonomous experimental control with machine learning, toward accelerated discovery of inorganic materials.
      - Developed a statistical-learning algorithm and its implementation for automatic signal-structure and spectral-peak detection in X-ray diffraction data.
      - Implemented live streaming of experimental data and online analysis with Apache Kafka; presented the work at Cornell University.
    tags:
      - Python
      - Apache Kafka
      - Statistical learning
      - X-ray diffraction

  - role: Undergraduate Research Assistant
    org: Johns Hopkins University · Department of Chemistry
    start: 2020-01-01
    end: 2023-05-31
    summary: |
      Advisors: [Prof. Lan Cheng](https://sites.krieger.jhu.edu/cheng/) (2022–2023) and [Prof. J. D. Tovar](https://sites.krieger.jhu.edu/tovar-group/) (2020–2023). Baltimore, MD.

      - Studied relativistic effects in light- and heavy-atom molecules with coupled-cluster theory; computed vibrational lifetimes and polarizabilities of laser-cooled molecular and heavy-element ionic diatoms.
      - Modeled blackbody-driven vibrational lifetimes of optically trapped polyatomic molecules in collaboration with the Doyle group (Harvard); co-authored the resulting *Phys. Rev. A* paper and presented the work at the ACS Spring National Meeting.
      - Benchmarked perturbative versus variational treatments of spin–orbit coupling in heavy-element molecules.
      - Computed optimized geometries and orbital energies of cycloparaphenylenes with density-functional theory on HPC clusters; wrote a Python package for nucleus-independent chemical shifts and automated Gaussian16 workflows on the Maryland Advanced Research Computing Center.
      - Synthesized novel organic compounds and characterized them by NMR and mass spectrometry.
    tags:
      - Coupled cluster
      - DFT
      - CFOUR
      - Gaussian16
      - Python
    button:
      text: "Vilas et al., Phys. Rev. A 107, 062802 (2023)"
      url: "https://doi.org/10.1103/PhysRevA.107.062802"

  - role: Research Intern
    org: Massachusetts General Hospital · Pulmonary and Critical Care Medicine
    start: 2021-06-01
    end: 2021-08-31
    summary: |
      Advisors: Dr. Tristan Kooistra, Dr. Benjamin Medoff. Boston, MA.

      - Studied the response of airway epithelial cells to lung inflammation and scarring toward an improved understanding of idiopathic pulmonary fibrosis.
      - Created, maintained, and monitored tissue co-cultures grown from basal and immune cells of murine samples.
      - Developed a Python algorithm based on Delaunay triangulation to parse the spatial distribution of cultured cells and visualize inflammation patterning.
    tags:
      - Python
      - Spatial statistics
      - Image analysis

